name: Fetch ServiceNow Jobs

on:
  schedule:
    # Runs at 08:00 and 20:00 UTC daily (adjust as needed)
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch: {} # Allows manual runs from the Actions tab in GitHub

permissions:
  contents: write # Important: allows GitHub Actions to commit updated jobs.json data back to the repo

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch ServiceNow jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_COUNTRIES: ${{ vars.ADZUNA_COUNTRIES }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          # JSearch has a small free quota — only call it on the 08:00 UTC run.
          SKIP_JSEARCH: ${{ github.event.schedule == '0 20 * * *' && 'true' || 'false' }}
        run: python3 fetch_jobs.py

      - name: Commit updated jobs data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/jobs.json
          git diff --staged --quiet || git commit -m "Update job leads $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
